[package]
name = "monoplan"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "monoplan"
path = "src/main.rs"

[lib]
name = "monoplan_cli"
path = "src/lib.rs"

[dependencies]
monoplan-protocol = { path = "../crates/protocol" }
monoplan-core = { path = "../core" }
monoplan-storage-sqlite = { path = "../crates/storage-sqlite" }
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_bytes = { workspace = true }
rmp-serde = { workspace = true }
toml = { workspace = true }
clap = { workspace = true }
dialoguer = { workspace = true }
dirs = { workspace = true }
hex = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
zeroize = { workspace = true }
serde_json = "1"
gethostname = "0.5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rand = { workspace = true }
rusqlite = { workspace = true }
tokio-tungstenite = "0.24"
http = "1"
futures-util = "0.3"
libc = "0.2"

[dev-dependencies]
monoplan-server = { path = "../server" }
tempfile = "3"
axum = { workspace = true }
