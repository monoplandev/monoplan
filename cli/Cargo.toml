[package]
name = "monoplan"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "monoplan"
path = "src/main.rs"

[lib]
name = "monoplan_cli"
path = "src/lib.rs"

[dependencies]
monoplan-protocol = { path = "../crates/protocol" }
monoplan-core = { path = "../core" }
monoplan-storage-sqlite = { path = "../crates/storage-sqlite" }
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
rmp-serde = { workspace = true }
toml = { workspace = true }
clap = { workspace = true }
dialoguer = { workspace = true }
dirs = { workspace = true }
hex = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
zeroize = { workspace = true }
serde_json = "1"
gethostname = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rand = { workspace = true }
rusqlite = { workspace = true }
# TLS for `wss://` (the hosted server); without a TLS feature every
# secure connect fails with "TLS support not compiled in". rustls with
# the bundled roots, matching reqwest's `rustls-tls` above.
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
http = "1"
futures-util = "0.3"
libc = "0.2"

[dev-dependencies]
monoplan-server = { path = "../server" }
tempfile = "3"
axum = { workspace = true }
