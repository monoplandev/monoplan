<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Monoplan</title>
    <!-- The macOS app's window (`spec/mac-window-plan.md`): the same
         client as `index.html` over a mirror doc, entered through
         `src/mirror.tsx`. No manifest or icons: this page is served to a
         WKWebView from the app bundle, never installed or bookmarked. -->
  </head>
  <body>
    <!-- Two things before any module runs. The mac-shell marker
         (`[data-shell="mac"]`): the app's window has no title bar, so
         the page draws its own drag strips, and module-level readers
         such as theme.ts consult it, which is why it cannot wait for
         mirror.tsx (imports evaluate first). And the theme before Solid
         mounts, as index.html does, but from the system query alone:
         the app owns Appearance (Settings › General) and the webview's
         prefers-color-scheme follows it (theme.ts). -->
    <script>
      document.documentElement.dataset.shell = "mac";
      try {
        document.documentElement.dataset.theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/mirror.tsx"></script>
  </body>
</html>
