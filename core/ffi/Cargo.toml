[package]
name = "monoplan-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "monoplan_ffi"
# staticlib ships in the XCFramework; cdylib exists so uniffi's
# library-mode bindgen has a host artifact to read metadata from.
crate-type = ["staticlib", "cdylib"]

# Standard uniffi bindgen entry point (proc-macro / library mode — no UDL).
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
# The host loop (`Host` below): the CLI crate's daemon, embedded.
monoplan = { path = "../../cli", features = ["uniffi"] }
# `matches_name`, the search tokenizer's name predicate.
monoplan-core = { path = ".." }
# `KdfParams::DEFAULT` for `signup`.
monoplan-protocol = { path = "../../crates/protocol" }
tokio = { workspace = true }
tracing-subscriber = { workspace = true }
uniffi = { version = "0.32", features = ["cli"] }
thiserror = { workspace = true }
